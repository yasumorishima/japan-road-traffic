name: Build check (branches)

# On a push to a branch other than main: the tests, planted defects that the tests must catch, and a full build of
# the Kaggle files from every archived release with an independent recomputation of the added columns. Nothing is
# uploaded or published.

on:
  push:
    branches-ignore: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/build-check.yml"
  workflow_dispatch:
    inputs:
      memo:
        description: Why this run
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install --quiet pandas pyarrow
          python scripts/test_fetch.py
          python scripts/test_collect.py
          python scripts/test_fixtures.py
          python scripts/test_enrich.py
          python scripts/test_daily.py
      - name: Police detector tests and planted defects
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q lhasa > /dev/null
          pip install --quiet polars==1.34.0 pyarrow==21.0.0 pandas==2.3.3 numpy==2.4.6
          (cd scripts/police && python test_police.py)
          bash scripts/police/mutate_police.sh
      - name: Planted defects (each must make test_daily.py fail)
        run: bash scripts/mutate_daily.sh
      - name: Planted defects (each must make test_enrich.py fail)
        env:
          PYTHONDONTWRITEBYTECODE: "1"  # a cached bytecode of the previous mutation must never be imported
        run: |
          set -u
          rm -rf scripts/__pycache__
          try() {  # name, python expression that edits the text s
            cp scripts/enrich.py /tmp/enrich.keep
            python - "$2" <<'EOF'
          import sys
          s = open("scripts/enrich.py", encoding="utf-8").read()
          t = eval(sys.argv[1])
          assert t != s, "the mutation did not change the file"
          open("scripts/enrich.py", "w", encoding="utf-8").write(t)
          EOF
            if python scripts/test_enrich.py > /tmp/m.log 2>&1; then echo "SURVIVED: $1"; cp /tmp/enrich.keep scripts/enrich.py; exit 1; fi
            echo "caught: $1 ($(tail -1 /tmp/m.log | cut -c1-120))"
            cp /tmp/enrich.keep scripts/enrich.py
          }
          try "baseline reads the row's own day" 's.replace("allow_exact_matches=False", "allow_exact_matches=True")'
          try "baseline looks forward" 's.replace("direction=\"backward\"", "direction=\"forward\"")'
          try "customary break days used" 's.replace("& df.customary_break.isna().to_numpy()", "")'
          try "holidays not counted as Sunday" 's.replace("np.where(hol, 6, df.time_jst.dt.dayofweek)", "df.time_jst.dt.dayofweek")'
          try "weather hour shifted" 's.replace("df.time_jst.dt.floor(\"h\").to_numpy()", "(df.time_jst.dt.floor(\"h\") + pd.Timedelta(hours=1)).to_numpy()")'
          try "empty join allowed" 's.replace("< MIN_FILLED", "< 0.0")'
          try "citizens holiday rule" 's.replace("named[i - 1] and named[i + 1]", "False")'
          try "run of days off" 's.replace("run[i:j] = j - i", "run[i:j] = 1")'
          try "obon range" 's.replace("(8, 13) <= x <= (8, 16)", "(8, 13) <= x <= (8, 15)")'
          try "calendar margin" 's.replace("CAL_MARGIN = 14", "CAL_MARGIN = 0")'
          try "quality flag ignored" 's.replace("w[e] = w[e].where(w[e + \"_aqc\"] == 0)", "pass")'
          try "rain limit" 's.replace("(\"precip_mm\", \"precip_1h_mm\", 10)", "(\"precip_mm\", \"precip_1h_mm\", 1000)")'
          try "element rule" 's.replace("s.notna().mean() >= 0.5", "True")'
          try "station coverage gate" 's.replace("near.mean() < MIN_STATION[col]", "False")'
          try "station without coordinates" 's.replace("D = np.where(np.isfinite(D), D, np.inf)", "D = D")'
          try "temperature limit" 's.replace("(\"temp_c\", \"temp_c\", 20)", "(\"temp_c\", \"temp_c\", 1000)")'
          try "rain coverage level" 's.replace("\"precip_mm\": 0.75", "\"precip_mm\": 0.7")'
          try "temperature coverage level" 's.replace("\"temp_c\": 0.9,", "\"temp_c\": 0.85,")'
          try "wind coverage level" 's.replace("\"wind_ms\": 0.9}", "\"wind_ms\": 0.85}")'
          try "coverage gate minimum" 's.replace("len(counters) >= 100 and", "len(counters) >= 1000 and")'
          try "coverage gate minimum lowered" 's.replace("len(counters) >= 100 and", "len(counters) >= 50 and")'
          try "coverage gate at its level" 's.replace("near.mean() < MIN_STATION[col]", "near.mean() <= MIN_STATION[col]")'
          try "snow limit" 's.replace("(\"snow_depth_cm\", \"snow_depth_cm\", 20)", "(\"snow_depth_cm\", \"snow_depth_cm\", 1000)")'
          try "rain limit 10.5 km" 's.replace("(\"precip_mm\", \"precip_1h_mm\", 10)", "(\"precip_mm\", \"precip_1h_mm\", 10.5)")'
          try "temperature limit 20.5 km" 's.replace("(\"temp_c\", \"temp_c\", 20)", "(\"temp_c\", \"temp_c\", 20.5)")'
          try "wind limit 19.5 km" 's.replace("(\"wind_ms\", \"wind_ms\", 20)", "(\"wind_ms\", \"wind_ms\", 19.5)")'
          try "snow limit 20.5 km" 's.replace("(\"snow_depth_cm\", \"snow_depth_cm\", 20)", "(\"snow_depth_cm\", \"snow_depth_cm\", 20.5)")'
          try "element rule level" 's.replace("s.notna().mean() >= 0.5", "s.notna().mean() >= 0.45")'
          try "element rule strict" 's.replace("s.notna().mean() >= 0.5", "s.notna().mean() > 0.5")'
          try "fill level" 's.replace("MIN_FILLED = 0.9 ", "MIN_FILLED = 0.85 ")'
          try "fill gate at its level" 's.replace("np.isfinite(v[inside]).mean() < MIN_FILLED", "np.isfinite(v[inside]).mean() <= MIN_FILLED")'
          try "fill minimum lowered" 's.replace("inside.sum() >= 1000", "inside.sum() >= 999")'
          try "snow in the fill gate" 's.replace("el != \"snow_depth_cm\" and ", "")'
          try "stopped days used" 's.replace("df.customary_break.isna().to_numpy() & ~stopped", "df.customary_break.isna().to_numpy()")'
          try "only 24 zero hours are a stop" 's.replace("gz.transform(\"sum\").lt(STOP_BELOW)", "gz.transform(\"sum\").eq(0)")'
          try "24 vehicles are a stop" 's.replace("gz.transform(\"sum\").lt(STOP_BELOW)", "gz.transform(\"sum\").le(STOP_BELOW)")'
          try "an empty or missing hour ignored" 's.replace("gz.transform(\"count\").eq(24) & ", "")'
          try "23 hours are enough" 's.replace("gz.transform(\"count\").eq(24)", "gz.transform(\"count\").ge(23)")'
          try "stop not per counter" 's.replace("t.groupby([\"counter_id\", \"sensor\", \"day\"]", "t.groupby([\"sensor\", \"day\"]")'
          try "stop not per sensor" 's.replace("t.groupby([\"counter_id\", \"sensor\", \"day\"]", "t.groupby([\"counter_id\", \"day\"]")'
      - name: Full build from the archive and an independent recomputation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          for tag in $(gh release list --limit 200 --json tagName -q ".[].tagName" | grep "^raw-"); do
            gh release download "$tag" --dir "dl/$tag" --pattern '*.csv.gz'
          done
          mkdir -p _weather
          for tag in $(gh release list --limit 200 --json tagName -q ".[].tagName" | grep "^amedas-"); do
            gh release download "$tag" --dir _weather --pattern "*.csv.gz"
          done
          python scripts/build_counters.py --from-files dl --no-api
          python scripts/build_kaggle.py dl _build --counters data/counters.csv --weather _weather
          python scripts/make_kaggle_meta.py _build --settings /tmp/settings.json
          ls -la _build | head -60
          python scripts/verify_enrich.py _build _weather
          python scripts/verify_daily.py _build

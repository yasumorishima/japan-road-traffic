name: Police counters pilot

# Measures one month of JARTIC's police detector counts (断面交通量情報).
# Runs only on pushes to the pilot branch. Publishes nothing: the numbers go to the log.
on:
  push:
    branches: [police-pilot]
    paths:
      - 'scripts/police/**'
      - '.github/workflows/police-pilot.yml'

permissions:
  contents: read

concurrency:
  group: police-pilot
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Measure one month
        env:
          WORK: /mnt/police
        run: |
          sudo mkdir -p /mnt/police && sudo chown "$USER" /mnt/police
          df -h / /mnt
          pip install --quiet polars==1.34.0
          python scripts/police/pilot.py

name: Collect police detector counts

# JARTIC 断面交通量情報 (police vehicle detectors on general roads, 5-minute counts), one month per run into the
# releases police-YYYY. The official month comes first (the page keeps only one month); then the compusophia.com
# archive from the newest month back to 2017-01, with a speed limit and one month at a time.
on:
  schedule:
    - cron: '41 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      memo:
        description: 'Why this run'
        required: true
        type: string
      month:
        description: 'YYYY-MM: only this month (empty: the next missing month)'
        required: false
        default: ''
        type: string
      max_months:
        description: 'Months in this run'
        required: false
        default: '1'
        type: string
      dry_run:
        description: 'Only list missing months'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: collect-police
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests (offline)
        run: |
          sudo apt-get install -y -q lhasa > /dev/null
          pip install --quiet polars==1.34.0 pyarrow pandas
          cd scripts/police && python test_police.py

      - name: Fetch, convert, check and upload
        env:
          GH_TOKEN: ${{ github.token }}
          WORK: /mnt/police
          MONTH: ${{ inputs.month }}
          MAX_MONTHS: ${{ inputs.max_months || '1' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          sudo mkdir -p /mnt/police && sudo chown "$USER" /mnt/police
          args=(--max-months "$MAX_MONTHS")
          if [ -n "$MONTH" ]; then args+=(--month "$MONTH"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/police/police.py "${args[@]}"

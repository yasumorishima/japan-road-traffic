name: Collect weather (AMeDAS)

# Hourly JMA AMeDAS observations, kept in the releases amedas-YYYYMM. The JMA site serves its maps for
# only about 9 days, so three runs a day leave room for missed scheduled runs. Separate from the traffic
# collector so that a problem here never holds up the traffic files or the Kaggle publish.
on:
  schedule:
    - cron: 41 17 DESKTOP-NJ8BIR1 KAGGLE_DATASETS_MEMO.md memory OSS_DATASCIENCE.md scripts settings.json DESKTOP-NJ8BIR1 KAGGLE_DATASETS_MEMO.md memory OSS_DATASCIENCE.md scripts settings.json *   # 02:41 JST
    - cron: 11 2 DESKTOP-NJ8BIR1 KAGGLE_DATASETS_MEMO.md memory OSS_DATASCIENCE.md scripts settings.json DESKTOP-NJ8BIR1 KAGGLE_DATASETS_MEMO.md memory OSS_DATASCIENCE.md scripts settings.json *    # 11:11 JST
    - cron: 53 10 DESKTOP-NJ8BIR1 KAGGLE_DATASETS_MEMO.md memory OSS_DATASCIENCE.md scripts settings.json DESKTOP-NJ8BIR1 KAGGLE_DATASETS_MEMO.md memory OSS_DATASCIENCE.md scripts settings.json *   # 19:53 JST
  workflow_dispatch:
    inputs:
      memo:
        description: Why this run
        required: true
        type: string
      dry_run:
        description: Only list missing days
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: collect-weather
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the weather collector (offline)
        run: python scripts/test_amedas.py

      - name: Fetch missing days and upload them to releases
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/amedas.py "${args[@]}"
